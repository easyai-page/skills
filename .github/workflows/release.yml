name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

# 同名 tag 重复推送时串行，不取消在跑的（发布动作不可重入，宁可排队）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 tag 与 Cargo.toml 版本一致
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag 与 Cargo.toml version $pkg 不一致（先 bump Cargo.toml 再打 tag）"
            exit 1
          fi
          echo "版本一致: $tag"

  build:
    needs: verify
    strategy:
      # 一个平台失败不取消其他平台——一次跑完能看到全部失败点；
      # release job needs: build，任何失败都不会产出残缺 release
      fail-fast: false
      matrix:
        include:
          # musl 与 aarch64-linux 用 cross 容器交叉（工具链完整，不依赖 arm runner 可见性）
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest,  tool: cargo }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest,  tool: cross }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest,  tool: cross }
          - { target: x86_64-apple-darwin,       os: macos-latest,   tool: cargo }
          - { target: aarch64-apple-darwin,      os: macos-latest,   tool: cargo }
          - { target: x86_64-pc-windows-msvc,    os: windows-latest, tool: cargo }
          # windows-2022 镜像自带 MSVC ARM64 工具集，可直接在 x64 runner 上交叉
          - { target: aarch64-pc-windows-msvc,   os: windows-latest, tool: cargo }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # cross 编译耗时约 2-4 分钟，仅两个 linux 交叉目标需要；
      # 不用第三方 install-action，保持供应链白名单最小（见 Global Constraints）
      - if: matrix.tool == 'cross'
        run: cargo install cross --locked
      - name: 编译
        shell: bash
        run: ${{ matrix.tool }} build --release --target ${{ matrix.target }}
      - name: 打包
        shell: bash
        run: bash scripts/pack-release.sh "${{ matrix.target }}" "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 校验和并发布
        shell: bash
        run: |
          cd dist
          ls -la   # 日志留证：7 个归档齐全
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          # 中文安装说明 + 自动生成的变更记录拼成 release notes
          cat > notes.md <<'EOF'
          ## 安装说明

          每个归档内含二进制和中文安装脚本，解压后运行对应脚本即可：

          | 平台 | 归档 | 安装命令 |
          |---|---|---|
          | Linux / macOS | `skills-*-<target>.tar.gz` | `tar xzf <归档> && cd skills-*-<target> && bash install.sh` |
          | Windows | `skills-*-<target>.zip` | 解压后在目录内运行 `powershell -ExecutionPolicy Bypass -File install.ps1` |

          安装脚本默认把 `skills` 装到 PATH 覆盖的目录（Linux/macOS 为 `/usr/local/bin` 或 `~/.local/bin`，Windows 为 `%LOCALAPPDATA%\Programs\skills` 并自动加入用户 PATH），可用 `--dir` / `-Dir` 自定义。

          校验下载完整性：`sha256sum -c SHA256SUMS`

          ## 更新内容

          EOF
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body >> notes.md || true
          gh release create "$GITHUB_REF_NAME" --notes-file notes.md ./*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
