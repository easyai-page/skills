name: ci

# 分支推送与 PR 只跑测试；v* tag 推送在测试通过后才编译 6 平台安装包并发版
# （结构与 ssh-tunnel 一致：test 常驻，build/release 用 tag 门禁）
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# release job 需要创建 Release 并上传产物
permissions:
  contents: write

# 同名 tag 重复推送时串行，不取消在跑的（发布动作不可重入，宁可排队）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 测试阶段：push/PR/tag 都跑，三平台功能测试
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  # 仅 tag：校验 tag 与 Cargo.toml 版本一致，防止发错版
  verify:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 tag 与 Cargo.toml 版本一致
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag 与 Cargo.toml version $pkg 不一致（先 bump Cargo.toml 再打 tag）"
            exit 1
          fi
          echo "版本一致: $tag"

  # 仅 tag：测试 + 版本校验通过后，6 平台原生编译打包
  build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, verify]
    strategy:
      # 一个平台失败不取消其他平台——一次跑完能看到全部失败点；
      # release job needs: build，任何失败都不会产出残缺 release
      fail-fast: false
      matrix:
        include:
          # 全部用原生 ARM/x86 runner（同 ssh-tunnel），不做交叉编译
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin,       os: macos-15-intel }
          - { target: aarch64-apple-darwin,      os: macos-14 }
          - { target: x86_64-pc-windows-msvc,    os: windows-latest }
          - { target: aarch64-pc-windows-msvc,   os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: 编译
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}
      - name: 打包（含中文安装脚本）
        shell: bash
        run: bash scripts/pack-release.sh "${{ matrix.target }}" "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  # 仅 tag：6 平台全绿后汇总产物、算校验和、创建带中文安装说明的 Release
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 校验和并发布
        shell: bash
        run: |
          cd dist
          ls -la   # 日志留证：6 个归档齐全
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          # 中文安装说明 + 自动生成的变更记录拼成 release notes
          cat > notes.md <<'EOF'
          ## 安装说明

          每个归档内含二进制和中文安装脚本，解压后运行对应脚本即可：

          | 平台 | 归档 | 安装命令 |
          |---|---|---|
          | Linux / macOS | `skills-*-<target>.tar.gz` | `tar xzf <归档> && cd skills-*-<target> && bash install.sh` |
          | Windows | `skills-*-<target>.zip` | 解压后在目录内运行 `powershell -ExecutionPolicy Bypass -File install.ps1` |

          安装脚本默认把 `skills` 装到 PATH 覆盖的目录（Linux/macOS 为 `/usr/local/bin` 或 `~/.local/bin`，Windows 为 `%LOCALAPPDATA%\Programs\skills` 并自动加入用户 PATH），可用 `--dir` / `-Dir` 自定义。

          校验下载完整性：`sha256sum -c SHA256SUMS`

          ## 更新内容

          EOF
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body >> notes.md || true
          gh release create "$GITHUB_REF_NAME" --notes-file notes.md ./*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
