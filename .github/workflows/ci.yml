name: ci
# 分支推送与 PR 只跑必要的功能测试；tag 推送的构建发布走 release.yml
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
