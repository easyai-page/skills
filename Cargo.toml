[package]
name = "skills"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
gix = { version = "0.66", default-features = false, features = ["blocking-network-client"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
dialoguer = "0.11"
ratatui = "0.29"
crossterm = "0.28"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
open = "5"

[dev-dependencies]
tempfile = "3"
