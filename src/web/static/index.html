<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"><title>skills 管理</title>
<style>
body { font-family: system-ui; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
table { border-collapse: collapse; width: 100%; }
td, th { border: 1px solid #ddd; padding: 6px 10px; }
nav button { margin-right: 8px; }
.on { color: green; } .off { color: #999; }
</style>
</head>
<body>
<h1>skills 管理</h1>
<nav>
  <button id="nav-installs">已安装</button>
  <button id="nav-sources">仓库缓存</button>
  <button id="nav-favorites">收藏</button>
  <button id="nav-update">执行更新</button>
</nav>
<div id="installs"></div>
<div id="sources" style="display:none"></div>
<div id="favorites" style="display:none">
  <p>
    <input id="fav-source" placeholder="仓库地址（owner/repo、URL 或本地路径）" size="42">
    <input id="fav-skill" placeholder="技能名（可空 = 整仓）" size="18">
    <button id="fav-add">收藏</button>
  </p>
  <div id="fav-list"></div>
</div>
<script>
// 安全约定：registry 数据（技能名/分类/仓库键/commit 等，来自第三方仓库或用户输入）
// 一律经 textContent / value / checked 注入 DOM，绝不拼接进 innerHTML 或内联事件属性；
// 事件全部 addEventListener 绑定，值经闭包传递——从根上杜绝 XSS 与属性注入。
async function api(path, opts) {
  const r = await fetch('/api/' + path, opts);
  if (!r.ok) {
    // 服务端错误以纯文本 body 返回，带给调用方展示；status 一并挂出供按码分支（如 409 确认链）
    const err = new Error((await r.text()) || ('HTTP ' + r.status));
    err.status = r.status;
    throw err;
  }
  return (r.headers.get('content-type')||'').includes('json') ? r.json() : null;
}
function el(tag, text) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  return e;
}
function cell(tr, child) {
  const td = el('td');
  if (child) td.appendChild(child);
  tr.appendChild(td);
  return td;
}
function show(id) {
  for (const d of ['installs','sources','favorites']) document.getElementById(d).style.display = d===id?'':'none';
  refresh();
}
function targetRef(i) { return i.target.kind==='global' ? i.target.name : i.target.root; }
function renderInstalls(installs) {
  const table = el('table');
  const head = el('tr');
  for (const h of ['技能','方式','目标','分类','自动更新','']) head.appendChild(el('th', h));
  table.appendChild(head);
  for (const i of installs) {
    const tr = el('tr');
    tr.appendChild(el('td', i.skill));
    tr.appendChild(el('td', i.method));
    tr.appendChild(el('td', i.target.kind + ':' + targetRef(i)));

    const tagInput = document.createElement('input');
    tagInput.value = i.tags.join(',');
    tagInput.addEventListener('change', () => setTags(i.skill, i.target.kind, targetRef(i), tagInput.value));
    cell(tr, tagInput);

    if (i.method === 'copy') {
      const sel = document.createElement('select');
      for (const [v, label] of [['', '跟随包级'], ['true', '开'], ['false', '关']]) {
        const opt = el('option', label);
        opt.value = v;
        opt.selected = v === '' ? i.auto_update === null : i.auto_update === (v === 'true');
        sel.appendChild(opt);
      }
      sel.addEventListener('change', () => setAU(i.skill, i.target.kind, targetRef(i), sel.value));
      cell(tr, sel);
    } else {
      tr.appendChild(el('td', '跟随包级'));
    }

    const rmBtn = el('button', '删除');
    rmBtn.addEventListener('click', () => rm(i.skill, i.target.kind, targetRef(i)));
    cell(tr, rmBtn);
    table.appendChild(tr);
  }
  return table;
}
function renderSources(sources) {
  const table = el('table');
  const head = el('tr');
  for (const h of ['仓库','commit','自动更新']) head.appendChild(el('th', h));
  table.appendChild(head);
  for (const [k, s] of Object.entries(sources)) {
    const tr = el('tr');
    tr.appendChild(el('td', k));
    tr.appendChild(el('td', (s.commit || '').slice(0, 7)));
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!s.auto_update;
    cb.addEventListener('change', () => setSourceAU(k, cb.checked));
    cell(tr, cb);
    table.appendChild(tr);
  }
  return table;
}
function renderFavorites(favs) {
  const wrap = el('div');
  for (const [key, f] of Object.entries(favs)) {
    const single = f.skills.length === 1 && f.skills[0].source_path === '.';
    const head = el('p');
    head.appendChild(el('strong', key));
    const meta = f.url ? `  （${(f.commit||'').slice(0,7)}，收藏于 ${(f.bookmarked_at||'').slice(0,10)}）` : '  （本地源）';
    head.appendChild(document.createTextNode(meta));
    if (single) {
      // 单技能仓库：二级留空，用途与操作挂一级行
      head.appendChild(document.createTextNode(' — ' + f.skills[0].description));
      const ins = el('button', '安装');
      ins.addEventListener('click', () => openInstall(key, f.skills[0].name));
      head.appendChild(ins);
      const del = el('button', '删除');
      del.addEventListener('click', () => rmFav(key, []));
      head.appendChild(del);
      wrap.appendChild(head);
      continue;
    }
    const delAll = el('button', '删除整包');
    delAll.addEventListener('click', () => rmFav(key, []));
    head.appendChild(delAll);
    wrap.appendChild(head);
    const table = el('table');
    for (const s of f.skills) {
      const tr = el('tr');
      tr.appendChild(el('td', s.name));
      tr.appendChild(el('td', s.description));
      const ins = el('button', '安装');
      ins.addEventListener('click', () => openInstall(key, s.name));
      cell(tr, ins);
      const del = el('button', '删除');
      del.addEventListener('click', () => rmFav(key, [s.name]));
      cell(tr, del);
      table.appendChild(tr);
    }
    wrap.appendChild(table);
  }
  return wrap;
}
async function addFav() {
  const source = document.getElementById('fav-source').value.trim();
  const skill = document.getElementById('fav-skill').value.trim();
  if (!source) return;
  try {
    await api('favorites', {method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({source, skill: skill ? [skill] : []})});
    refresh();
  } catch (e) {
    alert('收藏失败: ' + e.message);
  }
}
async function rmFav(source, skills) {
  if (!confirm(`删除收藏 ${source}${skills.length ? ' 的 ' + skills.join(',') : ''}？`)) return;
  await api('favorites/remove', {method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({source, skill: skills})});
  refresh();
}
// 安装面板：global target 下拉（/api/targets）+ project 绝对路径输入 + method 选择
let installPanel = null;
async function openInstall(source, skill) {
  if (installPanel) installPanel.remove();
  let targets;
  try {
    targets = await api('targets');
  } catch (e) {
    alert('加载 targets 失败: ' + e.message);
    return;
  }
  const panel = el('p');
  panel.appendChild(el('span', `安装 ${skill} → `));
  const sel = document.createElement('select');
  for (const t of targets) {
    const opt = el('option', `global:${t.name}`);
    opt.value = `global:${t.name}`;
    sel.appendChild(opt);
  }
  const optP = el('option', 'project（绝对路径）');
  optP.value = 'project';
  sel.appendChild(optP);
  panel.appendChild(sel);
  const pathInput = document.createElement('input');
  pathInput.placeholder = '/abs/project/path';
  pathInput.style.display = 'none';
  sel.addEventListener('change', () => {
    pathInput.style.display = sel.value === 'project' ? '' : 'none';
  });
  panel.appendChild(pathInput);
  const msel = document.createElement('select');
  for (const [v, label] of [['', '默认'], ['symlink', 'symlink'], ['copy', 'copy']]) {
    const o = el('option', label);
    o.value = v;
    msel.appendChild(o);
  }
  panel.appendChild(msel);
  const ok = el('button', '确认安装');
  ok.addEventListener('click', () => doInstall(source, skill, sel.value, pathInput.value.trim(), msel.value));
  panel.appendChild(ok);
  const cancel = el('button', '取消');
  cancel.addEventListener('click', () => { panel.remove(); installPanel = null; });
  panel.appendChild(cancel);
  document.getElementById('favorites').appendChild(panel);
  installPanel = panel;
}
async function doInstall(source, skill, targetSel, projectPath, method) {
  const target = targetSel === 'project'
    ? {kind:'project', root: projectPath}
    : {kind:'global', name: targetSel.slice('global:'.length)};
  const body = {source, skill, target, overwrite: false};
  if (method) body.method = method;
  try {
    await api('favorites/install', {method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify(body)});
    alert('已安装 ' + skill);
  } catch (e) {
    // 409 = 目标已存在：确认后以 overwrite 重试一次（同 runUpdate 的确认链）
    if (e.status === 409) {
      if (!confirm(e.message + '\n\n覆盖现有目录？')) return;
      body.overwrite = true;
      try {
        await api('favorites/install', {method:'POST', headers:{'content-type':'application/json'},
          body: JSON.stringify(body)});
        alert('已覆盖安装 ' + skill);
      } catch (e2) {
        alert('安装失败: ' + e2.message);
      }
      return;
    }
    alert('安装失败: ' + e.message);
  }
}
async function refresh() {
  const installs = await api('installs');
  document.getElementById('installs').replaceChildren(renderInstalls(installs));
  const sources = await api('sources');
  document.getElementById('sources').replaceChildren(renderSources(sources));
  const favs = await api('favorites');
  document.getElementById('fav-list').replaceChildren(renderFavorites(favs));
}
function targetBody(kind, ref) { return kind==='global' ? {kind:'global',name:ref} : {kind:'project',root:ref}; }
async function setAU(skill, kind, ref, v) {
  await api('auto-update', {method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({skill, target: targetBody(kind, ref), value: v===''?null:v==='true'})});
}
async function setSourceAU(key, v) {
  await api('auto-update', {method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({source: key, value: v})});
}
async function setTags(skill, kind, ref, v) {
  await api('tags', {method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({skill, target: targetBody(kind, ref), tags: v.split(',').map(s=>s.trim()).filter(Boolean)})});
}
async function rm(skill, kind, ref) {
  if (!confirm(`删除 ${skill}？`)) return;
  await api('remove', {method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({skill, target: targetBody(kind, ref)})});
  refresh();
}
async function runUpdate() {
  try {
    const r = await api('update', {method:'POST'});
    alert(r.done.join('\n') || '无更新');
    refresh();
  } catch (e) {
    // 409 = 副本存在本地修改：明细确认后以 ?force=true 重试一次；用户取消则不做任何变更
    if (e.status === 409) {
      if (!confirm(e.message + '\n\n将覆盖上述本地修改，继续？')) return;
      try {
        const r = await api('update?force=true', {method:'POST'});
        alert(r.done.join('\n') || '无更新');
        refresh();
      } catch (e2) {
        alert('更新失败: ' + e2.message);
      }
      return;
    }
    alert('更新失败: ' + e.message);
  }
}
document.getElementById('nav-installs').addEventListener('click', () => show('installs'));
document.getElementById('nav-sources').addEventListener('click', () => show('sources'));
document.getElementById('nav-favorites').addEventListener('click', () => show('favorites'));
document.getElementById('fav-add').addEventListener('click', addFav);
document.getElementById('nav-update').addEventListener('click', runUpdate);
refresh();
</script>
</body>
</html>
